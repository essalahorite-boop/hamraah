<title>Hamraah ہمراہ — Carpool Mansehra · Abbottabad · Haripur · Islamabad · Rawalpindi</title>
<meta name="description" content="Find or offer a carpool seat between Mansehra, Abbottabad, Haripur, Islamabad and Rawalpindi. مانسہرہ، ایبٹ آباد، ہری پور، اسلام آباد اور راولپنڈی کے درمیان سیٹ ڈھونڈیں یا پیش کریں۔">
<meta property="og:type" content="website">
<meta property="og:title" content="Hamraah ہمراہ — Carpool / کارپول">
<meta property="og:description" content="Mansehra · Abbottabad · Haripur · Islamabad · Rawalpindi — seats, fares and drivers in one place. سیٹیں، کرائے اور ڈرائیور ایک جگہ۔">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f5; --card:#fff; --ink:#15221d; --muted:#5f6f68; --line:#e1e7e4;
  --brand:#0f766e; --brand2:#115e59; --soft:#e6f4f1; --warn:#b45309; --warnbg:#fff7ed;
  --red:#b91c1c; --radius:14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
html[lang=ur] body,html[lang=ur] input,html[lang=ur] select,html[lang=ur] textarea,html[lang=ur] button{font-family:'Noto Nastaliq Urdu',Inter,serif}
html[lang=ur] body{line-height:2.1;font-size:15px}
html[lang=ur] label{text-transform:none;letter-spacing:0;font-size:13px}
.ltr{direction:ltr;unicode-bidi:isolate;font-family:Inter,system-ui,sans-serif}
a{color:var(--brand)}
header{background:linear-gradient(135deg,#0f766e,#134e4a);color:#fff;padding:16px 16px 0}
.wrap{max-width:1040px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{margin:0;font-size:22px;letter-spacing:-.3px}
.brand small{opacity:.85;font-size:13px}
.logo{width:38px;height:38px;border-radius:10px;background:#fff2;display:grid;place-items:center;font-size:20px;flex:none}
.langbtn{margin-inline-start:auto;background:#fff;color:var(--brand2);border:0;border-radius:99px;padding:7px 14px;font-weight:700;cursor:pointer;flex:none;font-size:14px}
nav{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
nav a{color:#d7f0ec;text-decoration:none;padding:9px 14px;border-radius:10px 10px 0 0;font-weight:600;white-space:nowrap}
nav a.on{background:var(--bg);color:var(--ink)}
main{padding:18px 16px 30px}
.banner{background:var(--warnbg);color:var(--warn);border:1px solid #fed7aa;padding:10px 12px;border-radius:10px;margin-bottom:14px;font-size:14px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;background:var(--card);padding:12px;border-radius:var(--radius);border:1px solid var(--line);margin-bottom:14px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff;color:var(--ink);font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid #99d6cc;border-color:var(--brand)}
textarea{resize:vertical;min-height:64px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--brand);color:#fff;padding:10px 16px;border-radius:9px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--brand2)}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.red{background:transparent;color:var(--red);border:1px solid #fecaca}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.big{padding:14px 20px;font-size:17px}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline;padding:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px}
.card.dim{opacity:.6}
.route{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;flex-wrap:wrap}
.route .arrow{color:var(--brand)}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{background:var(--soft);color:var(--brand2);padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600}
.chip.gray{background:#eef1f0;color:var(--muted)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.fare{font-size:20px;font-weight:700;white-space:nowrap}
.fare small{font-size:12px;color:var(--muted);font-weight:500}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.contact{border-top:1px dashed var(--line);padding-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.match{font-size:13px;color:var(--brand2);background:var(--soft);padding:6px 9px;border-radius:8px;cursor:pointer;border:0;font:inherit;text-align:start}
.empty{text-align:center;padding:40px 20px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:var(--radius)}
.form{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;max-width:720px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
@media(max-width:560px){.fgrid{grid-template-columns:1fr}}
.seg{display:flex;background:#e6ebe9;border-radius:12px;padding:4px;margin-bottom:16px;max-width:460px}
.seg button{flex:1;border:0;background:transparent;padding:12px;border-radius:9px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer;font-size:15px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0001}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;align-items:center;gap:6px;text-transform:none;font-size:14px;font-weight:500;color:var(--ink);border:1px solid var(--line);padding:7px 10px;border-radius:9px;margin:0;cursor:pointer}
.checks input{width:auto}
.err{color:var(--red);font-size:14px;margin-top:8px;font-weight:600}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.other{margin-top:6px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);background:#f8faf9}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#15221d;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.head h2{margin:0;font-size:19px}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.show{display:flex}
.modal .box{background:var(--bg);border-radius:var(--radius);max-width:700px;width:100%;max-height:85vh;overflow:auto;padding:16px}
.howwrap{margin-bottom:14px}.howwrap summary{cursor:pointer;font-weight:700;color:var(--brand2);padding:4px 0 8px}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.howto div{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;font-size:14px}
.howto b{display:block;margin-bottom:4px}
footer{max-width:1040px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:13px}
footer .note{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.langpick{position:fixed;inset:0;background:linear-gradient(135deg,#0f766e,#134e4a);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
.langpick.show{display:flex}
.langpick .box{background:#fff;border-radius:18px;padding:28px 22px;max-width:360px;width:100%;text-align:center}
.langpick h2{margin:6px 0 18px;font-size:20px;line-height:1.9}
.langpick .btn{width:100%;margin-top:10px}
.urdu{font-family:'Noto Nastaliq Urdu',serif}
</style>
</head>
<body>
<header><div class="wrap" id="hdr"></div></header>
<main><div class="wrap" id="app"></div></main>
<footer id="foot"></footer>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="langpick" id="langpick"><div class="box">

let LANG = 'ur';
try{ LANG = localStorage.getItem('hm_lang') || ''; }catch(e){}
const t = (k, v={}) => (T[LANG||'en'][k] ?? T.en[k] ?? k).replace(/\{(\w+)\}/g, (_,x)=>v[x] ?? '');
const city = c => LANG==='ur' ? (CITIES[c] || c) : c;
const routeName = (a,b) => `${city(a)} ${LANG==='ur'?'←':'→'} ${city(b)}`;

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').trim().toLowerCase();
const titleCase = s => String(s||'').trim().replace(/\s+/g,' ').replace(/\b\w/g, c => c.toUpperCase());
const todayStr = () => { const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const SEATS = ['single','female','family','group'], LUGS = ['none','light','medium','heavy'], FLEXES = ['exact','1h','3h','any'];
const money = n => Number(n).toLocaleString('en-US');

function fmtDate(d, tm){
  if(!d) return '';
  const dt = new Date(d+'T'+(tm||'00:00'));
  const loc = LANG==='ur' ? 'ur-PK' : 'en-GB';
  const day = dt.toLocaleDateString(loc,{weekday:'short',day:'numeric',month:'short'});
  return tm ? day + ' · ' + dt.toLocaleTimeString(LANG==='ur'?'ur-PK':'en-US',{hour:'numeric',minute:'2-digit'}) : day;
}
const cleanPhone = p => String(p||'').replace(/[\s\-()]/g,'');
const validPhone = p => /^(\+92|0092|92|0)?3\d{9}$/.test(cleanPhone(p));
function waNumber(p){ let n = cleanPhone(p).replace(/^\+/,''); if(n.startsWith('0092')) n=n.slice(2); else if(n.startsWith('0')) n='92'+n.slice(1); else if(n.startsWith('3')) n='92'+n; return n; }
const isPast = x => new Date(x.date+'T'+(x.time||'23:59')).getTime() < Date.now() - 2*3600e3;
function mins(tm){ if(!tm) return null; const [h,m]=tm.split(':').map(Number); return h*60+m; }
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),2400); }
function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }

/* ================= API store ================= */
const Store = {
  rides:[], requests:[], loaded:false, error:null, tokens:{}, reportedIds:[], cid:'',
  async init(){
    try{ this.tokens = JSON.parse(store('hm_tokens')||'{}'); this.reportedIds = JSON.parse(store('hm_reported')||'[]'); }catch(e){}
    this.cid = store('hm_cid') || (crypto.randomUUID ? crypto.randomUUID().replace(/-/g,'') : Math.random().toString(36).slice(2)+Date.now().toString(36));
    store('hm_cid', this.cid);
    await this.refresh();
    setInterval(()=>{ if(!document.hidden) this.refresh(); }, 30000);
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) this.refresh(); });
  },
  async refresh(){
    try{
      const [r,q] = await Promise.all(['rides','requests'].map(k=>fetch('/api/'+k).then(x=>{ if(!x.ok) throw 0; return x.json(); })));
      this.rides=r; this.requests=q; this.error=null;
    }catch(e){ this.error='offline'; }
    this.loaded=true; render();
  },
  async call(method, url, body, token){
    let res;
    try{
      res = await fetch(url, { method, headers:{'Content-Type':'application/json','x-client-id':this.cid, ...(token?{'x-edit-token':token}:{})}, body: body?JSON.stringify(body):undefined });
    }catch(e){ throw {code:'generic'}; }
    const json = await res.json().catch(()=>({}));
    if(!res.ok) throw { code: json.code || 'generic' };
    return json;
  },
  saveTokens(){ store('hm_tokens', JSON.stringify(this.tokens)); },
  async add(kind, data){ const { id, token } = await this.call('POST','/api/'+kind, data); this.tokens[id]=token; this.saveTokens(); await this.refresh(); },
  async update(kind, id, patch){ await this.call('PATCH',`/api/${kind}/${id}`, patch, this.tokens[id]); await this.refresh(); },
  async remove(kind, id){ await this.call('DELETE',`/api/${kind}/${id}`, null, this.tokens[id]); delete this.tokens[id]; this.saveTokens(); await this.refresh(); },
  async report(kind, id){ await this.call('POST',`/api/${kind}/${id}/report`); this.reportedIds.push(id); store('hm_reported', JSON.stringify(this.reportedIds)); },
  mine(x){ return !!this.tokens[x.id]; }
};
const errText = e => t('err_'+((e&&e.code)||'generic'));

/* ================= matching ================= */
function rideFits(r, q){
  if(norm(r.from)!==norm(q.from) || norm(r.to)!==norm(q.to) || r.date!==q.date) return false;
  if(r.status!=='open' || q.status!=='open') return false;
  if(Number(r.seats) < Number(q.seats) || !(r.allows||[]).includes(q.seatType)) return false;
  const win = {exact:30,'1h':60,'3h':180,any:1e9}[q.flex||'1h'];
  const a=mins(r.time), b=mins(q.time);
  if(a!=null && b!=null && Math.abs(a-b)>win) return false;
  if(q.budget && r.fare && Number(r.fare) > Number(q.budget)*1.15) return false;
  return true;
}
const activeRides = () => Store.rides.filter(r=>!isPast(r));
const activeReqs = () => Store.requests.filter(r=>!isPast(r));

function knownCities(){

  return [...s].filter(Boolean);
}
function cityOptions(selected, first){

}

function passFilter(x, kind){
  if(F.from && norm(x.from)!==norm(F.from)) return false;
  if(F.to && norm(x.to)!==norm(F.to)) return false;
  if(F.date && x.date!==F.date) return false;
  if(F.type && (kind==='rides' ? !(x.allows||[]).includes(F.type) : x.seatType!==F.type)) return false;
  return true;
}
const byWhen = (a,b)=> (a.date+(a.time||'')).localeCompare(b.date+(b.time||''));

  document.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{ postKind=b.dataset.pk; render(true); });
  const f = $('#pform');
  const hint = ()=>{ const s=fareStats().get(cityVal(f,'from')+'|'+cityVal(f,'to')); $('#fareHint').textContent = s?t('usual',{min:money(s.min),max:money(s.max),avg:money(s.avg)}):''; };
  f.querySelectorAll('[data-city]').forEach(sel=>sel.addEventListener('change',()=>{
    const o = f[sel.name+'Other']; o.style.display = sel.value==='__other'?'block':'none'; if(sel.value==='__other') o.focus(); hint();
  }));
  f.fromOther.addEventListener('input',hint); f.toOther.addEventListener('input',hint);
  f.onsubmit = async e=>{
    e.preventDefault();
    const fd = new FormData(f), err = k=>{ $('#perr').textContent=t('err_'+k); };
    const d = {};
    for(const [k,v] of fd.entries()) if(k!=='allows' && !k.endsWith('Other')) d[k]=String(v).trim();
    d.from = cityVal(f,'from'); d.to = cityVal(f,'to');
    if(!d.from||!d.to) return err('cities');
    if(norm(d.from)===norm(d.to)) return err('same');
    if(!d.date||!d.time) return err('datetime');
    if(isPast(d)) return err('past');
    d.seats = Number(d.seats); if(!(d.seats>=1 && d.seats<=15)) return err('seats');
    if(!d.name) return err('name');
    if(!validPhone(d.phone)) return err('phone');
    if(postKind==='ride'){ d.allows = fd.getAll('allows'); if(!d.allows.length) return err('allows'); d.fare = d.fare?Number(d.fare):null; }
    else d.budget = d.budget?Number(d.budget):null;
    const kind = postKind==='ride'?'rides':'requests', btn = f.querySelector('[type=submit]');
    btn.disabled=true; btn.textContent=t('posting');
    try{ await Store.add(kind, d); toast(t('posted')); location.hash = kind; }
    catch(ex){ $('#perr').textContent=errText(ex); btn.disabled=false; btn.textContent=t('tryAgain'); }
  };
}

function fareStats(){
  const m = new Map();
  for(const r of Store.rides){ if(!r.fare) continue; const k=r.from+'|'+r.to; if(!m.has(k)) m.set(k,[]); m.get(k).push(Number(r.fare)); }
  const out = new Map();
  for(const [k,a] of m) out.set(k,{n:a.length,min:Math.min(...a),max:Math.max(...a),avg:Math.round(a.reduce((x,y)=>x+y,0)/a.length/10)*10});
  return out;
}
function viewFares(){
  const s = [...fareStats()].sort((a,b)=>b[1].n-a[1].n);
  return `${banner()}<div class="head"><h2>${t('faresH')}</h2></div><p class="sub" style="margin-top:-6px">${t('faresSub')}</p>
  ${s.length?`<table><thead><tr><th>${t('routeCol')}</th><th class="num">${t('ridesCol')}</th><th class="num">${t('lowest')}</th><th class="num">${t('average')}</th><th class="num">${t('highest')}</th></tr></thead><tbody>
  ${s.map(([k,v])=>{ const [a,b]=k.split('|'); return `<tr><td>${esc(routeName(a,b))}</td><td class="num">${v.n}</td><td class="num">${money(v.min)}</td><td class="num"><b>${money(v.avg)}</b></td><td class="num">${money(v.max)}</td></tr>`; }).join('')}
  </tbody></table>`:`<div class="empty">${t('noFares')}</div>`}`;
}
function viewMine(){
  const r = Store.rides.filter(x=>Store.mine(x)).sort(byWhen), q = Store.requests.filter(x=>Store.mine(x)).sort(byWhen);
  return `${banner()}<div class="head"><h2>${t('mineH')}</h2></div><p class="sub" style="margin-top:-6px">${t('mineNote')}</p>
  <h3 style="font-size:15px">${t('myRides')} (${r.length})</h3>${r.length?`<div class="grid">${r.map(x=>rideCard(x)).join('')}</div>`:`<div class="empty">${t('noMyRides')}</div>`}
  <h3 style="font-size:15px;margin-top:22px">${t('myReqs')} (${q.length})</h3>${q.length?`<div class="grid">${q.map(x=>reqCard(x)).join('')}</div>`:`<div class="empty">${t('noMyReqs')}</div>`}`;
}

/* ================= shell & routing ================= */
const ROUTES = ['rides','requests','post','fares','mine'];
const route = () => { const h=location.hash.slice(1); return ROUTES.includes(h)?h:'rides'; };
function renderShell(){
  const L = LANG||'en';
  document.documentElement.lang = L; document.documentElement.dir = L==='ur'?'rtl':'ltr';
  $('#hdr').innerHTML = `<div class="brand"><div class="logo">🚗</div>
    <div><h1>${L==='ur'?'ہمراہ':'Hamraah'}</h1><small>${t('brandSub')}</small></div>
    <button class="langbtn ${L==='en'?'urdu':''}" data-setlang="${L==='ur'?'en':'ur'}">${t('langBtn')}</button></div>
    <nav id="nav">${ROUTES.map(r=>`<a href="#${r}">${t('nav_'+r)}</a>`).join('')}</nav>`;
  $('#foot').innerHTML = `<div class="note">⚠️ ${t('disclaimer')}</div>`;
}
let last = null;
function render(force){
  const r = route();
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on', a.getAttribute('href')==='#'+r));
  const app = $('#app'), key = r==='post' ? 'post'+postKind : r;
  if(r==='post'){ if(force || last!==key) { app.innerHTML=viewPost(); bindPost(); } }
  else if(r==='rides'||r==='requests'){
    if(force || last!==key){ app.innerHTML=viewList(r); bindFilters(); }
    else { $('#bn').innerHTML = banner(); if(document.activeElement?.closest?.('#fb')==null){ $('#fb').innerHTML=filterBar(); bindFilters(); } }
    renderList();
  }
  else app.innerHTML = r==='fares' ? viewFares() : viewMine();
  last = key;
}
function setLang(l){ LANG=l; store('hm_lang', l); $('#langpick').classList.remove('show'); renderShell(); render(true); }
window.addEventListener('hashchange', ()=>{ render(true); window.scrollTo(0,0); });

/* ================= clicks ================= */
function armed(btn, label){ // two-tap confirm
  if(btn.dataset.armed) return true;
  const old = btn.textContent; btn.dataset.armed='1'; btn.textContent=label;
  setTimeout(()=>{ if(btn.isConnected){ delete btn.dataset.armed; btn.textContent=old; } },3000);
  return false;
}
document.addEventListener('click', async e=>{
  const b = e.target.closest('button,a'); if(!b) return;
  const d = b.dataset;
  if(d.setlang) return setLang(d.setlang);
  if(d.postkind) postKind = d.postkind;
  if(d.copy){ try{ await navigator.clipboard.writeText(d.copy); toast(t('copied')); }catch(_){ toast(d.copy); } }
  if(d.del){ if(!armed(b, t('tapDel'))) return; const [k,id]=d.del.split(':'); try{ await Store.remove(k,id); toast(t('deleted')); }catch(ex){ toast(errText(ex)); } }
  if(d.report){ if(!armed(b, t('tapReport'))) return; const [k,id]=d.report.split(':'); try{ await Store.report(k,id); toast(t('reportedToast')); render(); }catch(ex){ toast(errText(ex)); } }
  if(d.toggle){ const [k,id]=d.toggle.split(':'); const x=Store[k].find(r=>r.id===id); try{ await Store.update(k,id,{status:x.status==='open'?'closed':'open'}); }catch(ex){ toast(errText(ex)); } }
  if(d.seat){ const x=Store.rides.find(r=>r.id===d.seat), s=Math.max(0,Number(x.seats)-1); try{ await Store.update('rides',x.id, s===0?{seats:0,status:'closed'}:{seats:s}); }catch(ex){ toast(errText(ex)); } }
  if(d.matches){
    const [type,id]=d.matches.split(':'); let html;
    if(type==='ride'){ const r=Store.rides.find(x=>x.id===id); html=`<div class="head"><h2>${esc(t('passengersFor',{r:routeName(r.from,r.to)}))}</h2><button class="btn ghost sm" data-close="1">${t('close')}</button></div><div class="grid">${activeReqs().filter(q=>rideFits(r,q)).map(q=>reqCard(q,false)).join('')}</div>`; }
    else { const q=Store.requests.find(x=>x.id===id); html=`<div class="head"><h2>${esc(t('ridesFor',{r:routeName(q.from,q.to)}))}</h2><button class="btn ghost sm" data-close="1">${t('close')}</button></div><div class="grid">${activeRides().filter(r=>rideFits(r,q)).map(r=>rideCard(r,false)).join('')}</div>`; }
    $('#modalBox').innerHTML=html; $('#modal').classList.add('show');
  }
  if(d.close) $('#modal').classList.remove('show');
});
$('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') $('#modal').classList.remove('show'); });

if(!LANG) $('#langpick').classList.add('show');
renderShell(); render(true); Store.init(); store('hm_seen','1');
</script>
</body>
