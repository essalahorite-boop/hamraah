<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hamraah ہمراہ — Carpool Mansehra · Abbottabad · Haripur · Islamabad · Rawalpindi</title>
<meta name="description" content="Find or offer a carpool seat between Mansehra, Abbottabad, Haripur, Islamabad and Rawalpindi. مانسہرہ، ایبٹ آباد، ہری پور، اسلام آباد اور راولپنڈی کے درمیان سیٹ ڈھونڈیں یا پیش کریں۔">
<meta property="og:type" content="website">
<meta property="og:title" content="Hamraah ہمراہ — Carpool / کارپول">
<meta property="og:description" content="Mansehra · Abbottabad · Haripur · Islamabad · Rawalpindi — seats, fares and drivers in one place. سیٹیں، کرائے اور ڈرائیور ایک جگہ۔">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@700&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Hamraah — "journey shared" look: deep pine green, fresh lime, soft off-white */
:root{
  --green:#0F5A3A; --green2:#0B4129; --lime:#C6F36B; --limesoft:#E4F8BF; --lime-ink:#2F4A0A;
  --bg:#F5F6F1; --card:#FFFFFF; --ink:#17231C; --muted:#5C6B62; --line:#E1E6DF;
  --red:#B3261E; --amber:#8A5A00; --amberbg:#FFF5D6;
  --r:18px; --r-sm:12px;
  --sans:'Plus Jakarta Sans',system-ui,sans-serif; --script:'Caveat',cursive; --urdu:'Noto Nastaliq Urdu','Plus Jakarta Sans',serif;
  --shadow:0 6px 24px rgba(15,90,58,.08);
}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
html[lang=ur] body,html[lang=ur] input,html[lang=ur] select,html[lang=ur] textarea,html[lang=ur] button{font-family:var(--urdu)}
html[lang=ur] body{line-height:2;font-size:15px}
.ltr{direction:ltr;unicode-bidi:isolate;font-family:var(--sans)}
.urdu{font-family:var(--urdu)}
a{color:var(--green)}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.wrap{max-width:1180px;margin:0 auto}
svg{flex:none}

/* ---------- header ---------- */
header{background:#fff;position:sticky;top:0;z-index:15;border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:18px;padding:10px 16px}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--green)}
.mark b{display:block;font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1}
.mark small{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
html[lang=ur] .mark b{font-size:22px;line-height:1.5}
nav{display:flex;gap:4px;margin-inline-start:auto}
nav a{display:flex;align-items:center;gap:7px;color:var(--ink);text-decoration:none;padding:8px 14px;border-radius:99px;font-weight:600;font-size:15px;white-space:nowrap}
nav a svg{width:19px;height:19px}
nav a:hover{background:var(--bg)}
nav a.on{background:var(--green);color:#fff}
nav a.post{background:var(--lime);color:var(--lime-ink)}
nav a.post.on{background:var(--green);color:#fff}
.langbtn{background:#fff;color:var(--green);border:1.5px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:700;cursor:pointer;font-size:14px}
.langbtn:hover{border-color:var(--green)}
.nl-s{display:none}
@media (max-width:900px){
  .topbar{justify-content:space-between}
  nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:6px 4px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(15,90,58,.08);z-index:16;margin:0;gap:0}
  nav a{flex-direction:column;gap:2px;color:var(--muted);font-size:11px;padding:4px 2px;flex:1;border-radius:12px}
  html[lang=ur] nav a{font-size:11px;line-height:1.6}
  nav a svg{width:24px;height:24px}
  nav a.on{background:none;color:var(--green)}
  nav a.post,nav a.post.on{background:var(--green);color:#fff;border-radius:18px;margin:-20px 6px 0;padding:9px 2px;box-shadow:0 6px 16px rgba(15,90,58,.35);flex:1.1}
  .nl-l{display:none}.nl-s{display:inline}
  main{padding-bottom:110px!important}
  footer{padding-bottom:120px!important}
}

main{padding:0 16px 48px}
.banner{background:var(--amberbg);color:var(--amber);border-radius:var(--r-sm);padding:10px 14px;margin:14px 0;font-size:14px;font-weight:600}

/* ---------- hero ---------- */
.hero{position:relative;margin-inline:calc(50% - 50vw);min-height:540px;display:flex;align-items:flex-end;color:#fff;overflow:hidden}
.hero.small{min-height:380px}
.hero-art,.hero-photo,.hero-shade{position:absolute;inset:0}
.hero-art svg{width:100%;height:100%;display:block}
.hero-photo{background-size:cover;background-position:center}
.hero-shade{background:linear-gradient(90deg,rgba(8,40,26,.78) 0%,rgba(8,40,26,.45) 45%,rgba(8,40,26,0) 75%),linear-gradient(0deg,rgba(8,40,26,.35),rgba(8,40,26,0) 40%)}
html[dir=rtl] .hero-shade{background:linear-gradient(270deg,rgba(8,40,26,.78) 0%,rgba(8,40,26,.45) 45%,rgba(8,40,26,0) 75%),linear-gradient(0deg,rgba(8,40,26,.35),rgba(8,40,26,0) 40%)}
.hero-in{position:relative;width:100%;max-width:1180px;margin:0 auto;padding:56px 16px 40px}
.hero h1{margin:0;font-size:58px;line-height:1.02;font-weight:800;letter-spacing:-1.5px;max-width:640px}
.hero h1 .script{font-family:var(--script);color:var(--lime);font-weight:700;font-size:1.25em;letter-spacing:0;display:inline-block;transform:rotate(-4deg)}
html[lang=ur] .hero h1{font-size:40px;line-height:1.8;letter-spacing:0;font-weight:700}
html[lang=ur] .hero h1 .script{font-family:var(--urdu);font-size:1em;transform:none}
.hero p{margin:12px 0 24px;font-size:19px;color:#E6F1EA;max-width:520px}
.searchcard{background:#fff;color:var(--ink);border-radius:22px;padding:10px;display:grid;grid-template-columns:1fr auto 1fr 1fr auto;gap:4px;align-items:center;max-width:860px;box-shadow:0 18px 40px rgba(0,0,0,.18)}
.sf{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:14px;min-width:0}
.sf+.sf,.swapb+.sf{border-inline-start:1px solid var(--line)}
.sf svg{color:var(--green);width:24px;height:24px}
.sf label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:0}
.sf select,.sf input{border:0;padding:0;font:inherit;font-weight:700;font-size:16px;background:transparent;color:var(--ink);width:100%;min-height:26px;cursor:pointer}
.sf select:focus,.sf input:focus{outline:none;box-shadow:none}
.swapb{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--green);cursor:pointer;display:grid;place-items:center}
.swapb:hover{border-color:var(--green)}
.searchcard .btn{height:58px;padding:0 26px;border-radius:16px}
@media (max-width:900px){
  .hero{min-height:0}
  .hero-in{padding:40px 16px 22px}
  .hero h1{font-size:40px;letter-spacing:-1px}
  html[lang=ur] .hero h1{font-size:30px}
  .hero p{font-size:16px;margin-bottom:18px}
  .hero-shade{background:linear-gradient(0deg,rgba(8,40,26,.85) 0%,rgba(8,40,26,.55) 55%,rgba(8,40,26,.15) 100%)!important}
  .searchcard{grid-template-columns:1fr auto 1fr;padding:8px;border-radius:20px}
  .sf{padding:8px 10px}
  .searchcard .sf.date{grid-column:1/-1;border-inline-start:0;border-top:1px solid var(--line);border-radius:0}
  .searchcard .btn{grid-column:1/-1;height:54px}
}

/* ---------- trust strip (wide screens) ---------- */
.trust{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;background:#fff;border-radius:var(--r);box-shadow:var(--shadow);margin:-28px auto 0;position:relative;max-width:1180px;padding:16px 8px}
.trust div{display:flex;align-items:center;gap:12px;padding:4px 18px}
.trust div+div{border-inline-start:1px solid var(--line)}
.trust .ic{width:44px;height:44px;border-radius:14px;background:var(--limesoft);color:var(--green);display:grid;place-items:center}
.trust b{display:block;font-size:15px}
.trust span{font-size:13px;color:var(--muted)}
@media (max-width:900px){.trust{display:none}}

/* ---------- section heads ---------- */
.shead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:34px 0 14px}
.shead h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.4px;display:flex;align-items:center;gap:8px}
.shead h2 svg{color:var(--green)}
html[lang=ur] .shead h2{font-size:21px;font-weight:700}
@media (max-width:900px){.shead{margin-top:24px}.shead h2{font-size:20px}}

/* ---------- popular routes ---------- */
.routes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.rcard{background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);display:flex;flex-direction:column;border:0;padding:0;font:inherit;text-align:start;cursor:pointer;transition:transform .15s}
.rcard:hover{transform:translateY(-3px)}
.rcard .pic{position:relative;height:120px}
.rcard .pic svg,.rcard .pic .photo{position:absolute;inset:0;width:100%;height:100%}
.photo{background-size:cover;background-position:center}
.rcard .meta{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.rcard b{display:block;font-size:16px;font-weight:700}
.rcard span{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.rcard .go{width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
html[dir=rtl] .go svg,html[dir=rtl] .flip{transform:scaleX(-1)}
@media (max-width:900px){
  .routes{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding:2px 16px 10px;gap:12px;scrollbar-width:none}
  .routes::-webkit-scrollbar{display:none}
  .rcard{flex:0 0 72%;scroll-snap-align:start}
  .rcard .pic{height:110px}
}

/* ---------- results layout ---------- */
.results{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
.filters{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:18px;position:sticky;top:84px}
.filters summary{list-style:none;font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px;cursor:default}
.filters summary::-webkit-details-marker{display:none}
.filters summary svg{color:var(--green)}
.fbody{display:grid;gap:18px;margin-top:16px}
.fbody label{display:block;font-weight:700;font-size:14px;margin-bottom:6px;color:var(--ink)}
.fbody .val{font-size:13px;color:var(--muted);font-weight:600}
input[type=range]{width:100%;accent-color:var(--green);padding:0;border:0}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink)}
.pill.on{background:var(--green);border-color:var(--green);color:#fff}
@media (max-width:900px){
  .results{grid-template-columns:1fr;gap:12px}
  .filters{position:static;padding:0 16px}
  .filters summary{cursor:pointer;padding:14px 0}
  .filters summary::after{content:'';margin-inline-start:auto;width:10px;height:10px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);margin-top:-4px}
  .filters[open] summary::after{transform:rotate(-135deg);margin-top:4px}
  .fbody{margin:0 0 16px}
}

/* ---------- ride / request cards ---------- */
.count{display:flex;justify-content:space-between;align-items:center;margin:0 2px 12px;gap:10px;flex-wrap:wrap}
.count h3{margin:0;font-size:18px;font-weight:800}
html[lang=ur] .count h3{font-weight:700;font-size:17px}
.rlist{display:grid;gap:16px}
.ride{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);display:grid;grid-template-columns:210px minmax(0,1fr) 200px;gap:20px;padding:14px;align-items:stretch}
.ride.dim{opacity:.55}
.ride .pic{position:relative;border-radius:14px;overflow:hidden;min-height:150px;background:#DDEBE1}
.ride .pic svg{position:absolute;inset:0;width:100%;height:100%}
.badge{position:absolute;top:10px;inset-inline-start:10px;background:var(--lime);color:var(--lime-ink);font-size:13px;font-weight:800;padding:4px 10px;border-radius:99px;display:flex;align-items:center;gap:6px;z-index:1}
.badge.full{background:var(--amberbg);color:var(--amber)}
.badge::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.info{display:flex;flex-direction:column;gap:9px;min-width:0;padding:4px 0}
.info h3{margin:0;font-size:20px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
html[lang=ur] .info h3{font-weight:700;font-size:18px}
.info h3 .arr{color:var(--green)}
.line{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink);flex-wrap:wrap}
.line svg{width:18px;height:18px;color:var(--green)}
.line .sep{color:var(--muted)}
.line .soft{color:var(--muted)}
.driver{display:flex;align-items:center;gap:10px;margin-top:4px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--limesoft);color:var(--green);display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.driver b{display:block;font-weight:700;line-height:1.25}
.driver span{font-size:13px;color:var(--muted)}
.side{display:flex;flex-direction:column;justify-content:space-between;gap:10px;align-items:stretch;padding:4px 0}
.price{text-align:end}
.price b{font-size:28px;font-weight:800;color:var(--green);letter-spacing:-.5px}
.price span{font-size:14px;color:var(--muted);font-weight:600}
.price .open{font-size:15px;font-weight:700;color:var(--muted)}
.acts{display:grid;gap:8px}
.extra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px}
.match{font-size:14px;font-weight:700;color:var(--green);background:var(--limesoft);padding:7px 12px;border-radius:10px;cursor:pointer;border:0;font:inherit}
@media (max-width:900px){
  .ride{grid-template-columns:1fr;gap:12px;padding:10px}
  .ride .pic{min-height:150px}
  .info{padding:0 6px}
  .ride .pic{min-height:170px}
  .side{flex-direction:column;align-items:stretch;padding:0 6px 4px;gap:10px}
  .price{text-align:start;display:flex;align-items:baseline;gap:6px}
  .price b{font-size:26px}
  .acts{grid-template-columns:1fr 1fr}
  .extra{margin:0 6px}
}

/* ---------- buttons, forms, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--green);color:#fff;padding:12px 20px;border-radius:14px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;font-size:15px;min-height:48px;transition:transform .1s,background .15s}
.btn:active{transform:scale(.97)}
.btn:hover{background:var(--green2)}
.btn:disabled{opacity:.6}
.btn.lime{background:var(--limesoft);color:var(--green)}
.btn.lime:hover{background:var(--lime)}
.btn.ghost{background:#fff;color:var(--green);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--green);background:#fff}
.btn.red{background:#fff;color:var(--red);border:1.5px solid #f1c9c6}
.btn.sm{padding:6px 12px;font-size:14px;min-height:36px;border-radius:10px}
.btn.big{padding:15px 24px;font-size:17px;min-height:56px}
.btn.wide{flex:1}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;padding:0}
label{display:block;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:6px}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r-sm);font:inherit;font-size:16px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(15,90,58,.15)}
textarea{resize:vertical;min-height:80px}
.chip{background:var(--limesoft);color:var(--green);padding:4px 10px;border-radius:8px;font-size:13px;font-weight:700}
.chip.gray{background:#F0F2EE;color:var(--muted)}
.empty{text-align:center;padding:40px 20px;color:var(--muted);background:#fff;border-radius:var(--r);box-shadow:var(--shadow)}
.empty svg{display:block;margin:0 auto 10px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.empty .btn{margin-top:14px}

/* ---------- post form ---------- */
.pagehead{margin:26px 0 16px}
.pagehead h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.5px}
html[lang=ur] .pagehead h2{font-size:23px;font-weight:700}
.pagehead p{margin:4px 0 0;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;max-width:720px}
.seg button{border:2px solid var(--line);background:#fff;padding:16px 12px;border-radius:var(--r);font:inherit;font-weight:800;color:var(--ink);cursor:pointer;font-size:17px;text-align:center}
.seg button small{font-weight:600;color:var(--muted);font-size:13px}
.seg button.on{border-color:var(--green);background:var(--limesoft);color:var(--green)}
.form{max-width:720px;display:grid;gap:14px}
.sec{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.sec h3{margin:0 0 14px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:10px}
html[lang=ur] .sec h3{font-weight:700}
.sec h3 i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid .full{grid-column:1/-1}
@media(max-width:560px){.fgrid{grid-template-columns:1fr}}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checks label{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;border:1.5px solid var(--line);padding:11px 12px;border-radius:var(--r-sm);margin:0;cursor:pointer}
.checks label:has(input:checked){border-color:var(--green);background:var(--limesoft)}
.checks input{width:18px;height:18px;accent-color:var(--green)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:50px;height:50px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:#fff;font-size:22px;font-weight:800;color:var(--green);cursor:pointer}
.stepper input{text-align:center;font-weight:800;font-size:18px}
.err{color:var(--red);font-size:15px;font-weight:700}
.err:empty{display:none}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.hint.fare{color:var(--green);font-weight:700}
.other{margin-top:6px}
.submitbar{display:flex;gap:10px}

/* ---------- fares & mine ---------- */
.fares{display:grid;gap:12px;max-width:820px}
.fare-row{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center}
.fare-row .rt{font-weight:800}
.fare-row .avg{font-size:24px;font-weight:800;text-align:end;color:var(--green)}
.fare-row .rng{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.fare-row .bar{flex:1;height:6px;background:var(--limesoft);border-radius:3px;position:relative}
.fare-row .bar i{position:absolute;top:0;bottom:0;background:var(--green);border-radius:3px}
h4{font-size:17px;margin:24px 0 12px}

/* ---------- detail sheet ---------- */
.modal{position:fixed;inset:0;background:rgba(10,30,20,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.show{display:flex}
.modal .box{background:var(--bg);border-radius:24px;max-width:720px;width:100%;max-height:90vh;overflow:auto;animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:900px){.modal{align-items:flex-end;padding:0}.modal .box{border-radius:24px 24px 0 0;max-height:92vh}}
.dhero{position:relative;height:190px}
.dhero svg{position:absolute;inset:0;width:100%;height:100%}
.dclose{position:absolute;top:12px;inset-inline-end:12px;width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:var(--ink);font-size:22px;cursor:pointer;z-index:2;box-shadow:var(--shadow)}
.dbody{padding:18px;display:grid;gap:14px}
.dbody h2{margin:0;font-size:24px;font-weight:800}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dgrid div{background:#fff;border-radius:14px;padding:10px 12px}
.dgrid span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.dgrid b{font-size:15px}
.dfoot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr auto;gap:10px}

/* ---------- misc ---------- */
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:16px}
.head h2{margin:0;font-size:20px}
.lede{color:var(--muted);margin:0 0 16px;font-size:15px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;z-index:30}
.toast.show{opacity:1;transform:translateX(-50%)}
details.howwrap{margin-top:24px;background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:4px 16px}
details.howwrap summary{cursor:pointer;font-weight:800;color:var(--green);padding:12px 0}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding-bottom:14px}
.howto div{font-size:14px;color:var(--muted)}
.howto b{display:block;color:var(--ink);margin-bottom:2px}
footer{max-width:1180px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:13px}
footer .note{border-top:1px solid var(--line);padding-top:16px}
.langpick{position:fixed;inset:0;background:var(--green);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
.langpick.show{display:flex}
.langpick .box{background:#fff;border-radius:24px;padding:30px 22px;max-width:360px;width:100%;text-align:center}
.langpick h2{margin:10px 0 2px;font-size:30px;font-weight:800;color:var(--green)}
.langpick p{margin:0 0 20px;color:var(--muted)}
.langpick .btn{width:100%;margin-top:10px}
</style>
</head>

const $ = s => document.querySelector(s);

const norm = s => String(s||'').trim().toLowerCase();
const titleCase = s => String(s||'').trim().replace(/\s+/g,' ').replace(/\b\w/g, c => c.toUpperCase());
const todayStr = () => { const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };

function fmtDate(d, tm){
  if(!d) return '';
  const dt = new Date(d+'T'+(tm||'00:00'));
  const loc = LANG==='ur' ? 'ur-PK' : 'en-GB';
  const day = dt.toLocaleDateString(loc,{weekday:'short',day:'numeric',month:'short'});
  return tm ? day + ' · ' + dt.toLocaleTimeString(LANG==='ur'?'ur-PK':'en-US',{hour:'numeric',minute:'2-digit'}) : day;
}
const cleanPhone = p => String(p||'').replace(/[\s\-()]/g,'');
const validPhone = p => /^(\+92|0092|92|0)?3\d{9}$/.test(cleanPhone(p));
function waNumber(p){ let n = cleanPhone(p).replace(/^\+/,''); if(n.startsWith('0092')) n=n.slice(2); else if(n.startsWith('0')) n='92'+n.slice(1); else if(n.startsWith('3')) n='92'+n; return n; }
const isPast = x => new Date(x.date+'T'+(x.time||'23:59')).getTime() < Date.now() - 2*3600e3;
function mins(tm){ if(!tm) return null; const [h,m]=tm.split(':').map(Number); return h*60+m; }
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),2400); }
function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }

/* ================= API store ================= */
const Store = {
  rides:[], requests:[], loaded:false, error:null, tokens:{}, reportedIds:[], cid:'',
  async init(){
    try{ this.tokens = JSON.parse(store('hm_tokens')||'{}'); this.reportedIds = JSON.parse(store('hm_reported')||'[]'); }catch(e){}
    this.cid = store('hm_cid') || (crypto.randomUUID ? crypto.randomUUID().replace(/-/g,'') : Math.random().toString(36).slice(2)+Date.now().toString(36));
    store('hm_cid', this.cid);
    await this.refresh();
    setInterval(()=>{ if(!document.hidden) this.refresh(); }, 30000);
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) this.refresh(); });
  },
  async refresh(){
    try{
      const [r,q] = await Promise.all(['rides','requests'].map(k=>fetch('/api/'+k).then(x=>{ if(!x.ok) throw 0; return x.json(); })));
      this.rides=r; this.requests=q; this.error=null;
    }catch(e){ this.error='offline'; }
    this.loaded=true; render();
  },
  async call(method, url, body, token){
    let res;
    try{
      res = await fetch(url, { method, headers:{'Content-Type':'application/json','x-client-id':this.cid, ...(token?{'x-edit-token':token}:{})}, body: body?JSON.stringify(body):undefined });
    }catch(e){ throw {code:'generic'}; }
    const json = await res.json().catch(()=>({}));
    if(!res.ok) throw { code: json.code || 'generic' };
    return json;
  },
  saveTokens(){ store('hm_tokens', JSON.stringify(this.tokens)); },
  async add(kind, data){ const { id, token } = await this.call('POST','/api/'+kind, data); this.tokens[id]=token; this.saveTokens(); await this.refresh(); },
  async update(kind, id, patch){ await this.call('PATCH',`/api/${kind}/${id}`, patch, this.tokens[id]); await this.refresh(); },
  async remove(kind, id){ await this.call('DELETE',`/api/${kind}/${id}`, null, this.tokens[id]); delete this.tokens[id]; this.saveTokens(); await this.refresh(); },
  async report(kind, id){ await this.call('POST',`/api/${kind}/${id}/report`); this.reportedIds.push(id); store('hm_reported', JSON.stringify(this.reportedIds)); },
  mine(x){ return !!this.tokens[x.id]; }
};
const errText = e => t('err_'+((e&&e.code)||'generic'));

/* ================= matching ================= */
function rideFits(r, q){
  if(norm(r.from)!==norm(q.from) || norm(r.to)!==norm(q.to) || r.date!==q.date) return false;
  if(r.status!=='open' || q.status!=='open') return false;
  if(Number(r.seats) < Number(q.seats) || !(r.allows||[]).includes(q.seatType)) return false;
  const win = {exact:30,'1h':60,'3h':180,any:1e9}[q.flex||'1h'];
  const a=mins(r.time), b=mins(q.time);
  if(a!=null && b!=null && Math.abs(a-b)>win) return false;
  if(q.budget && r.fare && Number(r.fare) > Number(q.budget)*1.15) return false;
  return true;
}
const activeRides = () => Store.rides.filter(r=>!isPast(r));
const activeReqs = () => Store.requests.filter(r=>!isPast(r));

}

function passFilter(x, kind){
  if(F.from && norm(x.from)!==norm(F.from)) return false;
  if(F.to && norm(x.to)!==norm(F.to)) return false;
  if(F.date && x.date!==F.date) return false;
  if(F.type && (kind==='rides' ? !(x.allows||[]).includes(F.type) : x.seatType!==F.type)) return false;
  if(kind==='rides'){
    if(F.maxFare && x.fare && Number(x.fare) > F.maxFare) return false;
    if(F.minSeats && Number(x.seats) < F.minSeats) return false;
  }
  return true;
}

const DEFAULT_ROUTES = [['Mansehra','Islamabad'],['Abbottabad','Rawalpindi'],['Haripur','Islamabad'],['Islamabad','Mansehra']];
function popularRoutes(kind){
  const list = kind==='rides' ? activeRides().filter(r=>r.status==='open') : activeReqs().filter(r=>r.status==='open');
  const m = new Map();
  list.forEach(x=>{ const k=x.from+'|'+x.to; m.set(k,(m.get(k)||0)+1); });
  const top = [...m].sort((a,b)=>b[1]-a[1]).slice(0,4);
  for(const [a,b] of DEFAULT_ROUTES){ if(top.length>=4) break; if(!m.has(a+'|'+b)) top.push([a+'|'+b,0]); }
  return top.map(([k,n])=>{ const [a,b]=k.split('|'); return {a,b,n}; });
}
function routesBlock(kind){
  return popularRoutes(kind).map(({a,b,n})=>`<button class="rcard" data-route="${esc(a)}|${esc(b)}">

}

const cityVal = (f, name) => f[name].value==='__other' ? titleCase(f[name+'Other'].value) : f[name].value;
function bindPost(){
  document.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{ postKind=b.dataset.pk; render(true); });
  const f = $('#pform');
  const hint = ()=>{ const s=fareStats().get(cityVal(f,'from')+'|'+cityVal(f,'to')); $('#fareHint').textContent = s?t('usual',{min:money(s.min),max:money(s.max),avg:money(s.avg)}):''; };
  f.querySelectorAll('[data-city]').forEach(sel=>sel.addEventListener('change',()=>{
    const o = f[sel.name+'Other']; o.style.display = sel.value==='__other'?'block':'none'; if(sel.value==='__other') o.focus(); hint();
  }));
  f.fromOther.addEventListener('input',hint); f.toOther.addEventListener('input',hint);
  f.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{ const i=f.seats; i.value=Math.min(15,Math.max(1,(Number(i.value)||1)+Number(b.dataset.step))); });
  f.onsubmit = async e=>{
    e.preventDefault();
    const fd = new FormData(f), err = k=>{ $('#perr').textContent=t('err_'+k); };
    const d = {};
    for(const [k,v] of fd.entries()) if(k!=='allows' && !k.endsWith('Other')) d[k]=String(v).trim();
    d.from = cityVal(f,'from'); d.to = cityVal(f,'to');
    if(!d.from||!d.to) return err('cities');
    if(norm(d.from)===norm(d.to)) return err('same');
    if(!d.date||!d.time) return err('datetime');
    if(isPast(d)) return err('past');
    d.seats = Number(d.seats); if(!(d.seats>=1 && d.seats<=15)) return err('seats');
    if(!d.name) return err('name');
    if(!validPhone(d.phone)) return err('phone');
    if(postKind==='ride'){ d.allows = fd.getAll('allows'); if(!d.allows.length) return err('allows'); d.fare = d.fare?Number(d.fare):null; }
    else d.budget = d.budget?Number(d.budget):null;
    const kind = postKind==='ride'?'rides':'requests', btn = f.querySelector('[type=submit]');
    btn.disabled=true; btn.textContent=t('posting');
    try{ await Store.add(kind, d); toast(t('posted')); location.hash = kind; }
    catch(ex){ $('#perr').textContent=errText(ex); btn.disabled=false; btn.textContent=t('tryAgain'); }
  };
}

function fareStats(){
  const m = new Map();
  for(const r of Store.rides){ if(!r.fare) continue; const k=r.from+'|'+r.to; if(!m.has(k)) m.set(k,[]); m.get(k).push(Number(r.fare)); }
  const out = new Map();
  for(const [k,a] of m) out.set(k,{n:a.length,min:Math.min(...a),max:Math.max(...a),avg:Math.round(a.reduce((x,y)=>x+y,0)/a.length/10)*10});
  return out;
}

  const r = Store.rides.filter(x=>Store.mine(x)).sort(byWhen), q = Store.requests.filter(x=>Store.mine(x)).sort(byWhen);
  return `${banner()}<div class="pagehead"><h2>${t('mineH')}</h2></div><p class="lede">${t('mineNote')}</p>
  <h4>${t('myRides')} (${r.length})</h4>${r.length?`<div class="rlist">${r.map(x=>rideCard(x)).join('')}</div>`:`<div class="empty">${t('noMyRides')}</div>`}
  <h4>${t('myReqs')} (${q.length})</h4>${q.length?`<div class="rlist">${q.map(x=>reqCard(x)).join('')}</div>`:`<div class="empty">${t('noMyReqs')}</div>`}`;
}


/* ================= shell & routing ================= */
const ROUTES = ['rides','requests','post','fares','mine'];
const route = () => { const h=location.hash.slice(1); return ROUTES.includes(h)?h:'rides'; };
const ICON = {
  rides:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14v-4l-2-5H7l-2 5z"/><path d="M5 13h14"/><circle cx="8" cy="17" r="1.6"/><circle cx="16" cy="17" r="1.6"/></svg>',
  requests:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>',
  post:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  fares:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.4"/></svg>',
  mine:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
  wa:'<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.3-.8-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>'
};
const LOGO = `<svg width="54" height="38" viewBox="0 0 54 38" aria-hidden="true"><path d="M2 24 L14 8 L22 17 L30 5 L42 20 L52 14" fill="none" stroke="#0F5A3A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M6 31 L8 26 Q9 24 13 23.5 L20 23 L25 18.5 Q27 17 30 17 L37 17 Q40 17 42 19.5 L45 23 Q49 23.5 50 26 L50.5 31 Z" fill="#0F5A3A"/><path d="M24 23 L27.5 19.5 Q28.5 19 30 19 L33 19 L33 23 Z M35 19 L37.5 19 Q39.5 19 40.5 20.5 L42.5 23 L35 23 Z" fill="#C6F36B"/><circle cx="15" cy="31.5" r="3.6" fill="#17231C"/><circle cx="41" cy="31.5" r="3.6" fill="#17231C"/></svg>`;
function renderShell(){
  const L = LANG||'en';
  document.documentElement.lang = L; document.documentElement.dir = L==='ur'?'rtl':'ltr';
  $('#hdr').innerHTML = `<div class="topbar wrap">
      <a class="mark" href="#rides">${LOGO}<span><b>${L==='ur'?'ہمراہ':'Hamraah'}</b><small>${t('tagline')}</small></span></a>
      <nav id="nav">${ROUTES.map(r=>`<a href="#${r}" class="${r==='post'?'post':''}">${ICON[r]}<span class="nl-l">${t('nav_'+r)}</span><span class="nl-s">${t('navs_'+r)}</span></a>`).join('')}</nav>
      <button class="langbtn ${L==='en'?'urdu':''}" data-setlang="${L==='ur'?'en':'ur'}">${t('langBtn')}</button></div>`;
  $('#foot').innerHTML = `<div class="note">${t('disclaimer')}</div>`;
}
let last = null;
function render(force){
  const r = route();
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on', a.getAttribute('href')==='#'+r));
  const app = $('#app'), key = r==='post' ? 'post'+postKind : r;
  if(r==='post'){ if(force || last!==key) { app.innerHTML=viewPost(); bindPost(); } }
  else if(r==='rides'||r==='requests'){
    if(force || last!==key){ app.innerHTML=viewList(r); bindFilters(); }
    else $('#bn').innerHTML = banner();
    renderList();
  }
  else app.innerHTML = r==='fares' ? viewFares() : viewMine();
  last = key;
}
function setLang(l){ LANG=l; store('hm_lang', l); $('#langpick').classList.remove('show'); renderShell(); render(true); }
window.addEventListener('hashchange', ()=>{ render(true); window.scrollTo(0,0); });

/* ================= clicks ================= */
function armed(btn, label){ // two-tap confirm
  if(btn.dataset.armed) return true;
  const old = btn.textContent; btn.dataset.armed='1'; btn.textContent=label;
  setTimeout(()=>{ if(btn.isConnected){ delete btn.dataset.armed; btn.textContent=old; } },3000);
  return false;
}
document.addEventListener('click', async e=>{
  const b = e.target.closest('button,a'); if(!b) return;
  const d = b.dataset;
  if(d.setlang) return setLang(d.setlang);
  if(d.postkind) postKind = d.postkind;
  if(d.copy){ try{ await navigator.clipboard.writeText(d.copy); toast(t('copied')); }catch(_){ toast(d.copy); } }
  if(d.del){ if(!armed(b, t('tapDel'))) return; const [k,id]=d.del.split(':'); try{ await Store.remove(k,id); toast(t('deleted')); }catch(ex){ toast(errText(ex)); } }
  if(d.report){ if(!armed(b, t('tapReport'))) return; const [k,id]=d.report.split(':'); try{ await Store.report(k,id); toast(t('reportedToast')); render(); }catch(ex){ toast(errText(ex)); } }
  if(d.toggle){ const [k,id]=d.toggle.split(':'); const x=Store[k].find(r=>r.id===id); try{ await Store.update(k,id,{status:x.status==='open'?'closed':'open'}); }catch(ex){ toast(errText(ex)); } }
  if(d.seat){ const x=Store.rides.find(r=>r.id===d.seat), s=Math.max(0,Number(x.seats)-1); try{ await Store.update('rides',x.id, s===0?{seats:0,status:'closed'}:{seats:s}); }catch(ex){ toast(errText(ex)); } }
  if(d.route){ [F.from,F.to]=d.route.split('|'); $('#fFrom').innerHTML=cityOptions(F.from,t('anyCity')); $('#fTo').innerHTML=cityOptions(F.to,t('anyCity')); renderList(); $('#results').scrollIntoView({behavior:'smooth',block:'start'}); }
  if(d.minseats!==undefined){ F.minSeats=Number(d.minseats); document.querySelectorAll('[data-minseats]').forEach(x=>x.classList.toggle('on', x===b)); renderList(); }
  if(d.detail){ const [k,id]=d.detail.split(':'); const x=Store[k].find(r=>r.id===id); if(x){ $('#modalBox').innerHTML=detailSheet(k,x); $('#modal').classList.add('show'); } }
  if(d.matches){
    const [type,id]=d.matches.split(':'); let html;
    if(type==='ride'){ const r=Store.rides.find(x=>x.id===id); html=`<div class="head"><h2>${esc(t('passengersFor',{r:routeName(r.from,r.to)}))}</h2><button class="btn ghost sm" data-close="1">${t('close')}</button></div><div class="rlist" style="padding:0 16px 16px">${activeReqs().filter(q=>rideFits(r,q)).map(q=>reqCard(q,false)).join('')}</div>`; }
    else { const q=Store.requests.find(x=>x.id===id); html=`<div class="head"><h2>${esc(t('ridesFor',{r:routeName(q.from,q.to)}))}</h2><button class="btn ghost sm" data-close="1">${t('close')}</button></div><div class="rlist" style="padding:0 16px 16px">${activeRides().filter(r=>rideFits(r,q)).map(r=>rideCard(r,false)).join('')}</div>`; }
    $('#modalBox').innerHTML=html; $('#modal').classList.add('show');
  }
  if(d.close) $('#modal').classList.remove('show');
});
$('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') $('#modal').classList.remove('show'); });

if(!LANG) $('#langpick').classList.add('show');
renderShell(); render(true); Store.init(); store('hm_seen','1');
</script>
</body>
</html>
